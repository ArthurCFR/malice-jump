<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2333">
<title>Malice Jump 🐱</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#2b2333;
    font-family:'Courier New', monospace;
    touch-action:none; -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  #wrap {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  }
  canvas {
    display:block; image-rendering:auto;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  .screen {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:rgba(30,24,40,.82); backdrop-filter:blur(3px);
    color:#fff; text-align:center; padding:24px; z-index:10;
  }
  .hidden { display:none !important; }
  h1 {
    font-size:clamp(34px, 9vw, 52px); letter-spacing:2px;
    color:#ffd98a; text-shadow:3px 3px 0 #b0552f, 6px 6px 0 rgba(0,0,0,.35);
    line-height:1.1;
  }
  .hero { width:110px; height:110px; border-radius:50%;
    border:4px solid #ffd98a; box-shadow:0 6px 20px rgba(0,0,0,.5);
    animation:bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .legend {
    display:flex; flex-direction:column; gap:8px; font-size:15px;
    background:rgba(0,0,0,.35); border-radius:14px; padding:14px 20px;
  }
  .legend div { display:flex; align-items:center; gap:10px; }
  .legend img { width:34px; height:34px; border-radius:50%; }
  .btn {
    margin-top:6px; padding:14px 42px; font-size:20px; font-weight:bold;
    font-family:inherit; color:#2b2333; background:#ffd98a;
    border:0; border-radius:14px; cursor:pointer;
    box-shadow:0 5px 0 #b0552f; letter-spacing:1px;
  }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #b0552f; }
  #finalScore { font-size:44px; color:#ffd98a; font-weight:bold; }
  #bestScore { font-size:16px; opacity:.85; }
  .hint { font-size:13px; opacity:.7; max-width:280px; }
  #goHero { width:110px; height:110px; border-radius:50%; border:4px solid #e05555;
    box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .gameover-title { color:#ff8a8a; text-shadow:3px 3px 0 #7a2020, 6px 6px 0 rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas>

  <div id="home" class="screen">
    <img class="hero" src="assets/malice.png" alt="Malice">
    <h1>MALICE<br>JUMP</h1>
    <div class="legend">
      <div><img src="assets/malice.png" alt=""> Malice — saute le plus haut !</div>
      <div><img src="assets/azelie.png" alt=""> Azélie — +100 points 💖</div>
      <div><img src="assets/alicia.png" alt=""> Alicia — super saut 🚀</div>
      <div><img src="assets/artus.png" alt=""> Artus — DANGER, évite-le ! 😈</div>
    </div>
    <button class="btn" id="playBtn">JOUER</button>
    <div class="hint">📱 Touche la moitié gauche / droite de l'écran pour te déplacer &nbsp;·&nbsp; ⌨️ flèches ← →</div>
  </div>

  <div id="gameover" class="screen hidden">
    <img id="goHero" src="assets/artus.png" alt="Artus">
    <h1 class="gameover-title">GAME<br>OVER</h1>
    <div>SCORE</div>
    <div id="finalScore">0</div>
    <div id="bestScore"></div>
    <button class="btn" id="replayBtn">REJOUER</button>
  </div>
</div>

<script>
(() => {
  // ---------- Setup ----------
  const W = 480;
  // hauteur logique adaptée au ratio de l'écran (plein écran mobile)
  const H = Math.max(640, Math.min(1040, Math.round(W * window.innerHeight / Math.max(1, window.innerWidth))));
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Assets ----------
  const IMGS = {};
  const toLoad = { malice:'assets/malice.png', azelie:'assets/azelie.png',
                   alicia:'assets/alicia.png', artus:'assets/artus.png', bg:'assets/bg.webp' };
  let loaded = 0, total = Object.keys(toLoad).length;
  for (const [k, src] of Object.entries(toLoad)) {
    IMGS[k] = new Image();
    IMGS[k].onload = () => loaded++;
    IMGS[k].src = src;
  }

  // ---------- Audio (bleeps rétro) ----------
  let actx = null;
  function beep(freq, dur = 0.08, type = 'square', vol = 0.12, slide = 0) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    jump:  () => beep(340, .09, 'square', .08, 220),
    boost: () => { beep(500, .12, 'square', .1, 500); setTimeout(() => beep(900, .12, 'square', .08, 400), 90); },
    bonus: () => { beep(880, .07, 'triangle', .12); setTimeout(() => beep(1320, .1, 'triangle', .12), 70); },
    dead:  () => { beep(300, .25, 'sawtooth', .12, -220); setTimeout(() => beep(160, .35, 'sawtooth', .1, -100), 180); },
  };

  // ---------- State ----------
  const STATE = { HOME: 0, PLAY: 1, OVER: 2 };
  let state = STATE.HOME;
  let platforms = [], bonuses = [], enemies = [], particles = [];
  let player, score, best, cameraShake, topPlatformY, bgScroll;
  best = +(localStorage.getItem('malicejump_best') || 0);

  const PLAYER_R = 26;
  const GRAV = 0.42, JUMP_V = -13.5, BOOST_V = -22;
  const PLAT_W = 92, PLAT_H = 16;

  // difficulté croissante
  const diff = {
    gap:   s => Math.min(135, 78 + s / 45),
    movP:  s => Math.min(0.45, s / 3500),
    cloudP:s => Math.min(0.28, Math.max(0, (s - 800) / 7000)),
    artusP:s => s < 350 ? 0 : Math.min(0.22, (s - 350) / 6000),
    movSpd:s => 1.2 + Math.min(2.2, s / 1800),
  };

  function newPlatform(y) {
    const s = score || 0;
    const r = Math.random();
    let type = 'normal';
    if (r < diff.cloudP(s)) type = 'cloud';
    else if (r < diff.cloudP(s) + diff.movP(s)) type = 'moving';
    const p = {
      x: Math.random() * (W - PLAT_W), y, w: PLAT_W, h: PLAT_H, type,
      dir: Math.random() < .5 ? 1 : -1, alive: true, vanish: 0,
    };
    // bonus posé sur la plateforme (pas sur les nuages)
    if (type !== 'cloud') {
      const b = Math.random();
      if (b < 0.06) bonuses.push({ kind:'alicia', x: p.x + p.w/2, y: y - 30, r: 22, taken:false, wob: Math.random()*6 });
      else if (b < 0.14) bonuses.push({ kind:'azelie', x: p.x + p.w/2, y: y - 30, r: 22, taken:false, wob: Math.random()*6 });
    }
    // méchant Artus flottant près de cette hauteur
    if (Math.random() < diff.artusP(s)) {
      enemies.push({
        x: Math.random() * (W - 80) + 40, y: y - 90 - Math.random()*60,
        r: 30, t: Math.random()*10, amp: 60 + Math.random()*80, speed: .6 + Math.random()*.7, baseX: 0,
      });
      enemies[enemies.length-1].baseX = enemies[enemies.length-1].x;
    }
    return p;
  }

  function reset() {
    platforms = []; bonuses = []; enemies = []; particles = [];
    score = 0; cameraShake = 0; bgScroll = 0;
    player = { x: W/2, y: H - 140, vx: 0, vy: JUMP_V, dir: 1, boostT: 0 };
    // sol de départ + plateformes initiales
    platforms.push({ x: W/2 - 70, y: H - 90, w: 140, h: PLAT_H, type:'normal', dir:1, alive:true, vanish:0 });
    let y = H - 170;
    while (y > -100) { platforms.push(newPlatform(y)); y -= 60 + Math.random()*40; }
    topPlatformY = Math.min(...platforms.map(p => p.y));
  }

  // ---------- Input ----------
  const input = { left:false, right:false };
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  input.left  = true;
    if (e.key === 'ArrowRight') input.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && state !== STATE.PLAY) startGame();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft')  input.left  = false;
    if (e.key === 'ArrowRight') input.right = false;
  });
  const touches = new Map();
  function updateTouchDir() {
    input.left = input.right = false;
    for (const x of touches.values()) {
      if (x < window.innerWidth / 2) input.left = true; else input.right = true;
    }
  }
  window.addEventListener('pointerdown', e => {
    if (e.target.closest('.screen')) return;
    touches.set(e.pointerId, e.clientX); updateTouchDir();
  });
  window.addEventListener('pointermove', e => {
    if (touches.has(e.pointerId)) { touches.set(e.pointerId, e.clientX); updateTouchDir(); }
  });
  const endTouch = e => { touches.delete(e.pointerId); updateTouchDir(); };
  window.addEventListener('pointerup', endTouch);
  window.addEventListener('pointercancel', endTouch);

  // ---------- Particles ----------
  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4;
      particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1, life: 1, color });
    }
  }

  // ---------- Update ----------
  function update() {
    if (state !== STATE.PLAY) return;

    // contrôle horizontal
    const ACC = 0.9, MAXV = 8.5;
    if (input.left)  { player.vx -= ACC; player.dir = -1; }
    if (input.right) { player.vx += ACC; player.dir = 1; }
    if (!input.left && !input.right) player.vx *= 0.92;
    player.vx = Math.max(-MAXV, Math.min(MAXV, player.vx));
    player.x += player.vx;

    // wrap horizontal
    if (player.x < -PLAYER_R) player.x = W + PLAYER_R;
    if (player.x > W + PLAYER_R) player.x = -PLAYER_R;

    // gravité
    player.vy += GRAV;
    player.y += player.vy;
    if (player.boostT > 0) player.boostT--;

    // rebond sur plateformes (uniquement en descente)
    if (player.vy > 0) {
      for (const p of platforms) {
        if (!p.alive) continue;
        const px = player.x, py = player.y + PLAYER_R;
        if (px > p.x - 6 && px < p.x + p.w + 6 &&
            py > p.y && py < p.y + p.h + player.vy + 2) {
          player.y = p.y - PLAYER_R;
          player.vy = JUMP_V;
          sfx.jump();
          burst(px, p.y, '#ffd98a', 6);
          if (p.type === 'cloud') { p.alive = false; p.vanish = 1; }
          break;
        }
      }
    }

    // plateformes mobiles
    for (const p of platforms) {
      if (p.type === 'moving' && p.alive) {
        p.x += p.dir * diff.movSpd(score);
        if (p.x < 0) { p.x = 0; p.dir = 1; }
        if (p.x + p.w > W) { p.x = W - p.w; p.dir = -1; }
      }
      if (p.vanish > 0) p.vanish = Math.min(1, p.vanish + 0.08);
    }

    // méchants : oscillation
    for (const en of enemies) {
      en.t += 0.02 * en.speed;
      en.x = en.baseX + Math.sin(en.t * 3) * en.amp;
      if (en.x < en.r) en.x = en.r;
      if (en.x > W - en.r) en.x = W - en.r;
    }

    // caméra : monter le monde quand le joueur dépasse le milieu
    const LINE = H * 0.42;
    if (player.y < LINE) {
      const dy = LINE - player.y;
      player.y = LINE;
      score += Math.round(dy * 0.35);
      bgScroll += dy * 0.15;
      for (const p of platforms) p.y += dy;
      for (const b of bonuses)   b.y += dy;
      for (const en of enemies)  en.y += dy;
      for (const pa of particles) pa.y += dy;
      topPlatformY += dy;
    }

    // spawn de nouvelles plateformes en haut
    while (topPlatformY > -40) {
      const gap = diff.gap(score) * (0.75 + Math.random() * 0.5);
      const ny = topPlatformY - gap;
      platforms.push(newPlatform(ny));
      topPlatformY = ny;
    }

    // nettoyage bas d'écran
    platforms = platforms.filter(p => p.y < H + 60 && (p.alive || p.vanish < 1));
    bonuses   = bonuses.filter(b => b.y < H + 60 && !b.taken);
    enemies   = enemies.filter(en => en.y < H + 80);

    // bonus
    for (const b of bonuses) {
      b.wob += 0.08;
      const d = Math.hypot(player.x - b.x, player.y - (b.y + Math.sin(b.wob)*5));
      if (d < PLAYER_R + b.r) {
        b.taken = true;
        if (b.kind === 'azelie') {
          score += 100; sfx.bonus();
          burst(b.x, b.y, '#ff7ab8', 18);
        } else {
          player.vy = BOOST_V; player.boostT = 30; sfx.boost();
          burst(b.x, b.y, '#7ad6ff', 18);
        }
      }
    }

    // collision méchant
    for (const en of enemies) {
      const d = Math.hypot(player.x - en.x, player.y - en.y);
      if (d < PLAYER_R + en.r - 8) { gameOver(); return; }
    }

    // chute = mort
    if (player.y - PLAYER_R > H + 30) { gameOver(); return; }

    // particules
    for (const pa of particles) {
      pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.12; pa.life -= 0.03;
    }
    particles = particles.filter(pa => pa.life > 0);

    if (cameraShake > 0) cameraShake *= 0.85;
  }

  // ---------- Draw ----------
  function drawBubble(img, x, y, r, ringColor, squish = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1 / squish, squish);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = ringColor; ctx.lineWidth = 4; ctx.stroke();
    ctx.clip();
    ctx.drawImage(img, -r, -r, r * 2, r * 2);
    ctx.restore();
  }

  function drawPlatform(p) {
    ctx.save();
    if (p.vanish > 0) ctx.globalAlpha = 1 - p.vanish;
    const colors = { normal: ['#8a5a3b', '#c98a54'], moving: ['#4a7a8c', '#7ab8cc'], cloud: ['#9a8ab8', '#cfc0e8'] };
    const [dark, light] = colors[p.type];
    ctx.fillStyle = dark;
    ctx.fillRect(p.x, p.y + 4, p.w, p.h - 4);
    ctx.fillStyle = light;
    ctx.fillRect(p.x, p.y, p.w, 6);
    // petits pixels déco
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(p.x + 8, p.y + 2, 10, 2);
    ctx.fillRect(p.x + p.w - 22, p.y + 2, 8, 2);
    ctx.restore();
  }

  function draw() {
    // fond lofi en tuiles verticales avec parallax
    const bg = IMGS.bg;
    ctx.imageSmoothingEnabled = false;
    if (bg.complete && bg.naturalWidth) {
      const bw = W, bh = W * bg.naturalHeight / bg.naturalWidth;
      const off = (bgScroll % bh);
      for (let y = -bh + off; y < H + bh; y += bh) {
        ctx.drawImage(bg, 0, y, bw, bh);
      }
    } else {
      ctx.fillStyle = '#2b2333'; ctx.fillRect(0, 0, W, H);
    }
    // voile pour lisibilité (assombrit aussi le fond, sans filtre coûteux)
    ctx.fillStyle = 'rgba(30,24,40,.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;

    if (state === STATE.PLAY || state === STATE.OVER) {
      ctx.save();
      if (cameraShake > 0.5) ctx.translate((Math.random()-.5)*cameraShake, (Math.random()-.5)*cameraShake);

      for (const p of platforms) drawPlatform(p);

      for (const b of bonuses) {
        const yy = b.y + Math.sin(b.wob) * 5;
        const img = b.kind === 'azelie' ? IMGS.azelie : IMGS.alicia;
        const ring = b.kind === 'azelie' ? '#ff7ab8' : '#7ad6ff';
        // halo
        ctx.beginPath(); ctx.arc(b.x, yy, b.r + 6, 0, Math.PI*2);
        ctx.fillStyle = b.kind === 'azelie' ? 'rgba(255,122,184,.25)' : 'rgba(122,214,255,.25)';
        ctx.fill();
        drawBubble(img, b.x, yy, b.r, ring);
      }

      for (const en of enemies) {
        const yy = en.y + Math.sin(en.t * 5) * 4;
        ctx.beginPath(); ctx.arc(en.x, yy, en.r + 7, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(224,85,85,.3)'; ctx.fill();
        drawBubble(IMGS.artus, en.x, yy, en.r, '#e05555');
        // petites cornes de méchant
        ctx.fillStyle = '#e05555';
        ctx.beginPath();
        ctx.moveTo(en.x - en.r*.55, yy - en.r*.75); ctx.lineTo(en.x - en.r*.30, yy - en.r*.95); ctx.lineTo(en.x - en.r*.20, yy - en.r*.65);
        ctx.moveTo(en.x + en.r*.55, yy - en.r*.75); ctx.lineTo(en.x + en.r*.30, yy - en.r*.95); ctx.lineTo(en.x + en.r*.20, yy - en.r*.65);
        ctx.fill();
      }

      // particules
      for (const pa of particles) {
        ctx.globalAlpha = pa.life;
        ctx.fillStyle = pa.color;
        ctx.fillRect(pa.x - 2, pa.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      // joueur
      if (state === STATE.PLAY) {
        const squish = player.vy < -8 ? 1.12 : player.vy > 8 ? 0.92 : 1;
        const ring = player.boostT > 0 ? '#7ad6ff' : '#ffd98a';
        if (player.boostT > 0) {
          ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_R + 8, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(122,214,255,.3)'; ctx.fill();
        }
        drawBubble(IMGS.malice, player.x, player.y, PLAYER_R, ring, squish);
      }
      ctx.restore();

      // score HUD
      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      const scTxt = String(score).padStart(5, '0');
      ctx.fillText(scTxt, 18, 40);
      ctx.fillStyle = '#ffd98a';
      ctx.fillText(scTxt, 16, 38);
      // best
      ctx.font = '14px "Courier New", monospace';
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.fillText('BEST ' + best, 16, 60);
    }
  }

  // ---------- Flow ----------
  const homeEl = document.getElementById('home');
  const overEl = document.getElementById('gameover');

  function startGame() {
    reset();
    state = STATE.PLAY;
    homeEl.classList.add('hidden');
    overEl.classList.add('hidden');
    if (actx && actx.state === 'suspended') actx.resume();
    beep(660, .06, 'square', .08, 300);
  }

  function gameOver() {
    state = STATE.OVER;
    sfx.dead();
    cameraShake = 18;
    burst(player.x, player.y, '#e05555', 24);
    if (score > best) { best = score; localStorage.setItem('malicejump_best', best); }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScore').textContent = '🏆 Meilleur score : ' + best;
    setTimeout(() => overEl.classList.remove('hidden'), 600);
  }

  document.getElementById('playBtn').addEventListener('click', startGame);
  document.getElementById('replayBtn').addEventListener('click', startGame);

  // ---------- Loop ----------
  let last = 0, acc = 0;
  const STEP = 1000 / 60;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    acc += Math.min(100, t - last); last = t;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
